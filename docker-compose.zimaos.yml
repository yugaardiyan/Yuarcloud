# Yuarcloud — ZimaOS / CasaOS app compose
#
# Dashboard → Install a customized app → Import → Docker Compose.
# Paste all of this, then replace the JWT placeholder:
#
#   openssl rand -base64 48
#
# First login: yuarcloud / yuarcloud — change it immediately.
#
# Default data:
#   /DATA/AppData/yuarcloud/srv     user files — back this up
#   /DATA/AppData/yuarcloud/config  config.yaml + SQLite — back this up
#
# Custom folder: change only the first volume's `source` to an existing library,
# e.g. /media/HDD/YuarCloud. Keep `target: /srv`. Files already in that folder
# are adopted into the browser lazily when you open their directory; nothing is
# moved or rewritten. Nested items may need host write permission for uid 1000
# before they can be moved or deleted from the app.
#
# Image pinned to v1.2.2 (multi-arch). Change the tag to update.
# If 3103 is taken, change only `published` (e.g. "3104"); keep target 3103.
#
# x-casaos.hostname is what the dashboard uses for its Open link. Change it to
# your DNS name, or remove it and use http://<IP-ZimaOS>:3103 directly. Set
# scheme to https if the name is served through an HTTPS reverse proxy.

networks:
  default:
    name: yuarcloud

services:
  yuarcloud:
    container_name: yuarcloud
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2GB
        reservations:
          cpus: "0.00"
          memory: 256MB
    environment:
      TZ: Asia/Jakarta
      # REQUIRED: replace this. The server rejects the placeholder.
      YUAR_AUTH_JWT_SECRET: "PASTE-YOUR-OWN-64-CHARACTER-RANDOM-STRING-HERE"
    image: ghcr.io/yugaardiyan/yuarcloud:v1.2.2
    labels:
      icon: https://cdn.jsdelivr.net/gh/yugaardiyan/Yuarcloud@v1.2.2/web/public/logo.png
    network_mode: bridge
    ports:
      - mode: ingress
        protocol: tcp
        published: "3103"
        target: 3103
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /DATA/AppData/yuarcloud/srv
        target: /srv
        type: bind
      - bind:
          create_host_path: true
        source: /DATA/AppData/yuarcloud/config
        target: /config
        type: bind
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3103/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

x-casaos:
  hostname: yuarcloud.yuar.my.id
  icon: https://cdn.jsdelivr.net/gh/yugaardiyan/Yuarcloud@v1.2.2/web/public/logo.png
  index: /
  is_uncontrolled: false
  main: yuarcloud
  port_map: "3103"
  scheme: http
  store_app_id: yuarcloud
  title:
    custom: Yuarcloud
